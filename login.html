<!doctype html>
<html>
  <head>
    <title>Passkey Login</title>
  </head>
  <body>
    <h2>Login with Passkey</h2>

    <button onclick="loginWithPasskey()">Login</button>

    <script>
      const API_BASE = "http://localhost:4000/api/passkeys";

      function bufferToBase64URL(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");
      }

      function base64URLToUint8Array(base64url) {
        const base64 = base64url.replace(/-/g, "+").replace(/_/g, "/");
        const binary = atob(base64);
        return Uint8Array.from(binary, (c) => c.charCodeAt(0));
      }

      async function loginWithPasskey() {
        try {
          // 1. Get login options from backend
          const optionsRes = await fetch(`${API_BASE}/generate-passkey-login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: "ugwumbachizurumoke@gmail.com" }), // For demo, hardcode email. In real app, get from input field
          });
          const { options } = await optionsRes.json();

          options.challenge = base64URLToUint8Array(options.challenge);

          if (options.allowCredentials) {
            options.allowCredentials.forEach((cred) => {
              cred.id = base64URLToUint8Array(cred.id);
            });
          }

          const assertion = await navigator.credentials.get({
            publicKey: options,
          });

          // 3. Send assertion to backend with challenge
          const verifyRes = await fetch(`${API_BASE}/verify-passkey-login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: "ugwumbachizurumoke@gmail.com", // or from input field
              credential: {
                id: assertion.id,
                rawId: bufferToBase64URL(assertion.rawId),
                type: assertion.type,
                response: {
                  authenticatorData: bufferToBase64URL(
                    assertion.response.authenticatorData,
                  ),
                  clientDataJSON: bufferToBase64URL(
                    assertion.response.clientDataJSON,
                  ),
                  signature: bufferToBase64URL(assertion.response.signature),
                  userHandle: assertion.response.userHandle
                    ? bufferToBase64URL(assertion.response.userHandle)
                    : null,
                },
              },
            }),
          });

          const data = await verifyRes.json();
          console.log(data);

          if (data.success) {
            alert("Login successful");
            // window.location.href = "dashboard.html";
          } else {
            alert("Login failed");
          }
        } catch (err) {
          console.error(err);
          alert("Passkey login error");
        }
      }
    </script>
  </body>
</html>
