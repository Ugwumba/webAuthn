<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
  </head>
  <body>
    <h2>Dashboard</h2>

    <button onclick="registerPasskey()">Register Passkey</button>
    <button onclick="loadPasskeys()">Refresh Passkeys</button>

    <ul id="passkeyList"></ul>

    <script>
      const API_BASE = "http://localhost:4000/api/passkeys";
      function bufferToBase64URL(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }

        return btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");
      }

      async function registerPasskey() {
        // 1. Get registration options
        const res = await fetch(`${API_BASE}/generate-passkey-registration`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${sessionStorage.getItem("token")}`,
            "Content-Type": "application/json",
          },
        });

        const { options } = await res.json();
        console.log("Received options from backend:", options);

        // Convert challenge + user.id
        options.challenge = Uint8Array.from(
          atob(options.challenge.replace(/-/g, "+").replace(/_/g, "/")),
          (c) => c.charCodeAt(0),
        );

        options.user.id = Uint8Array.from(
          atob(options.user.id.replace(/-/g, "+").replace(/_/g, "/")),
          (c) => c.charCodeAt(0),
        );

        // 2. Create passkey
        const credential = await navigator.credentials.create({
          publicKey: options,
        });

        // 3. Send to backend
        await fetch(`${API_BASE}/verify-passkey-registration`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${sessionStorage.getItem("token")}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            id: credential.id, // already base64url
            rawId: bufferToBase64URL(credential.rawId),
            type: credential.type,
            response: {
              attestationObject: bufferToBase64URL(
                credential.response.attestationObject,
              ),
              clientDataJSON: bufferToBase64URL(
                credential.response.clientDataJSON,
              ),
            },
            deviceName: navigator.userAgent,
          }),
        });

        alert("Passkey registered successfully");
        loadPasskeys();
      }

      async function loadPasskeys() {
        try {
          const res = await fetch(
            "http://localhost:4000/api/passkeys",
            {
              headers: {
                Authorization: `Bearer ${sessionStorage.getItem("token")}`,
              },
            },
          );

          if (!res.ok) {
            console.error("Failed to load passkeys");
            return;
          }

          const data = await res.json();

          // passkey is a single object
          if (!data.passkey) return;

          const list = document.getElementById("passkeyList");
          if (!list) {
            console.error("passkeyList element not found");
            return;
          }

          list.innerHTML = "";

          const passkey = data.passkey;

          const li = document.createElement("li");
          li.textContent = `${passkey.deviceName} (Registered at: ${new Date(
            passkey.createdAt,
          ).toLocaleString()})`;

          const revokeBtn = document.createElement("button");
          revokeBtn.textContent = "Revoke";
          revokeBtn.onclick = () => revokePasskey(passkey.id);

          li.appendChild(revokeBtn);
          list.appendChild(li);
        } catch (err) {
          console.error("Error loading passkeys:", err);
        }
      }

      async function revoke(id) {
        await fetch(`http://localhost:4000/api/passkeys`, {
          method: "DELETE",
          headers: {
            Authorization: `Bearer ${sessionStorage.getItem("token")}`,
          },
        });
        loadPasskeys();
      }

      loadPasskeys();
    </script>
  </body>
</html>
