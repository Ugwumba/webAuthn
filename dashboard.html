<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
  </head>
  <body>
    <h2>Dashboard</h2>

    <button onclick="registerPasskey()">Register Passkey</button>
    <button onclick="loadPasskeys()">Refresh Passkeys</button>

    <ul id="passkeyList"></ul>

    <script>
      const API_BASE = "http://localhost:4000/api/user";
      function bufferToBase64URL(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }

        return btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");
      }

      async function registerPasskey() {
        // 1. Get registration options
        const res = await fetch(
          `${API_BASE}/security/passkeys/generate-passkey-registration`,
          {
            method: "POST",
            headers: {
              Authorization: `Bearer ${sessionStorage.getItem("token")}`,
              "Content-Type": "application/json",
            },
          },
        );

        const { options } = await res.json();

        // Convert challenge + user.id
        options.challenge = Uint8Array.from(
          atob(options.challenge.replace(/-/g, "+").replace(/_/g, "/")),
          (c) => c.charCodeAt(0),
        );

        options.user.id = Uint8Array.from(
          atob(options.user.id.replace(/-/g, "+").replace(/_/g, "/")),
          (c) => c.charCodeAt(0),
        );

        // 2. Create passkey
        const credential = await navigator.credentials.create({
          publicKey: options,
        });

        // 3. Send to backend
        await fetch(
          `${API_BASE}/security/passkeys/verify-passkey-registration`,
          {
            method: "POST",
            headers: {
              Authorization: `Bearer ${sessionStorage.getItem("token")}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              id: credential.id, // already base64url
              rawId: bufferToBase64URL(credential.rawId),
              type: credential.type,
              response: {
                attestationObject: bufferToBase64URL(
                  credential.response.attestationObject,
                ),
                clientDataJSON: bufferToBase64URL(
                  credential.response.clientDataJSON,
                ),
              },
              deviceName: navigator.userAgent,
            }),
          },
        );

        alert("Passkey registered successfully");
        loadPasskeys();
      }

      async function loadPasskeys() {
        const res = await fetch(`${API_BASE}/security/passkeys`, {
          headers: {
            Authorization: `Bearer ${sessionStorage.getItem("token")}`,
          },
        });

        if (!res.ok) {
          console.error("Failed to load passkeys");
          return;
        }

        const data = await res.json();

        if (!Array.isArray(data.passkeys)) return;

        const list = document.getElementById("passkeyList");
        list.innerHTML = "";

        data.passkeys.forEach((pk) => {
          const li = document.createElement("li");
          li.innerHTML = `
      ${pk.deviceName} (${pk.platform})
      <button onclick="revoke('${pk.credentialId}')">Revoke</button>
    `;
          list.appendChild(li);
        });
      }

      async function revoke(id) {
        await fetch(`${API_BASE}/security/passkeys/${id}`, {
          method: "DELETE",
          headers: {
            Authorization: `Bearer ${sessionStorage.getItem("token")}`,
          },
        });
        loadPasskeys();
      }

      loadPasskeys();
    </script>
  </body>
</html>
